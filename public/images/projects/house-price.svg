<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="100%" stop-color="#1c1f4a" />
    </linearGradient>
  </defs>
  <rect width="500" height="300" fill="url(#bgHP)" />
  <!-- Regression Curve Line & Data Points -->
  <circle cx="100" cy="220" r="6" fill="#38bdf8" />
  <circle cx="150" cy="190" r="6" fill="#38bdf8" />
  <circle cx="200" cy="170" r="6" fill="#38bdf8" />
  <circle cx="270" cy="130" r="6" fill="#38bdf8" />
  <circle cx="330" cy="100" r="6" fill="#38bdf8" />
  <circle cx="400" cy="70" r="6" fill="#38bdf8" />
  <!-- Best Fit Regression Line -->
  <line x1="70" y1="240" x2="430" y2="50" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" />
  <!-- House Outline -->
  <polygon points="250,90 290,130 210,130" fill="none" stroke="#a78bfa" stroke-width="3" />
  <rect x="220" y="130" width="60" height="50" fill="none" stroke="#a78bfa" stroke-width="3" />
</svg>
