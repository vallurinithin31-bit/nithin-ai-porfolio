<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="400" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
  </g>
  
  <!-- Glowing Circular Frame -->
  <circle cx="200" cy="180" r="90" fill="none" stroke="url(#glow)" stroke-width="4" stroke-dasharray="6,6" opacity="0.8" />
  
  <!-- AI Neural Network Nodes in Frame -->
  <circle cx="200" cy="150" r="32" fill="#06b6d4" opacity="0.2" />
  <circle cx="200" cy="150" r="24" fill="#06b6d4" opacity="0.8" />
  <path d="M160 250 C 160 210, 240 210, 240 250 Z" fill="#6366f1" opacity="0.8" />
  
  <!-- Neural Link Lines -->
  <line x1="200" y1="150" x2="140" y2="120" stroke="#06b6d4" stroke-width="2" opacity="0.6" />
  <circle cx="140" cy="120" r="5" fill="#38bdf8" />
  <line x1="200" y1="150" x2="260" y2="120" stroke="#6366f1" stroke-width="2" opacity="0.6" />
  <circle cx="260" cy="120" r="5" fill="#818cf8" />
  <line x1="200" y1="150" x2="200" y2="90" stroke="#10b981" stroke-width="2" opacity="0.6" />
  <circle cx="200" cy="90" r="5" fill="#34d399" />
  
  <!-- Text Label -->
  <text x="200" y="320" font-family="'Inter', sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    Valluri Nithin Sai
  </text>
  <text x="200" y="345" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8" text-anchor="middle">
    AI &amp; ML Engineer
  </text>
</svg>
